<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Fake News Detection System</h1>

    <form method="POST">

        <textarea
            name="news"
            rows="8"
            placeholder="Paste news here..."
            required>
        </textarea>

        <br>

        <button type="submit">
            Predict
        </button>

    </form>

    {% if prediction %}

<div class="result">

    {% if prediction == "REAL" %}
        <h2 style="color:green;">
            Prediction: REAL ✅
        </h2>
    {% else %}
        <h2 style="color:red;">
            Prediction: FAKE ❌
        </h2>
    {% endif %}

    <h3>
        Confidence:
        {{ "%.2f"|format(confidence) }}%
    </h3>

</div>

{% endif %}

</div>

</body>
</html>
